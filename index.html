/* ===== 用户福利卡片样式 ===== */

    <script>
        // 1. 复制功能
        function copyLink(btnElement, linkUrl) {
            navigator.clipboard.writeText(linkUrl).then(function() {
                const originalText = btnElement.innerText;
                btnElement.innerText = "成功";
                btnElement.classList.add("copied");
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove("copied");
                }, 1500);
            }, function() { alert("复制失败"); });
        }

        // 2. 卡片折叠
        function toggleCard(cardId) {
            document.getElementById(cardId).classList.toggle('collapsed');
        }

        // 3. 返回顶部 (悬浮)
        const myButton = document.getElementById("backToTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                myButton.style.display = "flex";
            } else {
                myButton.style.display = "none";
            }
        };
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. 新增：分类筛选功能
        function filterLinks(category) {
            // A. 更新按钮样式
            const buttons = document.getElementsByClassName('cat-btn');
            for (let btn of buttons) {
                btn.classList.remove('active');
                // 简单的判断：点击的按钮文字或者 onclick 参数匹配时高亮
                // 这里利用 event.currentTarget 更方便，但为了简化直接重置所有再高亮点击的会比较繁琐
                // 最简单的方式：
                if (btn.getAttribute('onclick').includes(category)) {
                    btn.classList.add('active');
                }
            }

            // B. 筛选表格行
            const rows = document.querySelectorAll('#video-table-body tr');
            
            rows.forEach(row => {
                const rowCat = row.getAttribute('data-category');
                
                if (category === 'all') {
                    // 如果选的是"全部"，显示所有行
                    row.style.display = ''; 
                } else {
                    // 否则，只有分类匹配才显示
                    if (rowCat === category) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                }
            });
        }
    </script>
